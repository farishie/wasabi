<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>My Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fdf8f5;--card:#fff;--tx:#4a4458;--mu:#8b8499;--ln:#eee6ee;--ac:#b7a4ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1b26;--card:#292535;--tx:#ece8f5;--mu:#a29bb5;--ln:#3a3548;--ac:#9a86e0;--mix:30%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1b26;--card:#292535;--tx:#ece8f5;--mu:#a29bb5;--ln:#3a3548;--ac:#9a86e0;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:210px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
nav h1{font-size:18px;margin:4px 8px 14px}
nav a{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:14px;color:var(--tx);text-decoration:none;font-size:14px;margin-bottom:3px}
nav a.on{background:color-mix(in srgb,var(--c,var(--ac)) var(--mix,60%),var(--card));font-weight:600}
main{flex:1;padding:20px;max-width:960px;min-width:0}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--mu);font-size:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.stat{border:0;border-radius:18px;padding:14px;text-align:left;cursor:pointer;color:var(--tx);font:inherit;background:color-mix(in srgb,var(--c) var(--mix,55%),var(--card))}
.stat b{display:block;font-size:26px}.stat span{font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
input,textarea,select{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);width:100%}
textarea{resize:vertical;grid-column:1/-1}
button.add,button.bt{background:var(--ac);color:var(--on,#fff);border:0;border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer}
.it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln)}
.it:last-child{border:0}.it .b{flex:1;min-width:0;overflow-wrap:anywhere}.it small{color:var(--mu);display:block;white-space:pre-wrap}
.it.dn b{text-decoration:line-through;color:var(--mu)}
.it input[type=checkbox]{width:auto;margin-top:4px}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px}
.in{color:#3a9a6a}.out{color:#d1627a}
a{color:var(--ac)}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9}
#lock[hidden]{display:none}
#lock input{width:200px;text-align:center;font-size:20px}
@media(max-width:700px){body{flex-direction:column}nav{width:100%;height:auto;position:relative;z-index:1;display:flex;gap:4px;padding:10px;overflow-x:auto}nav h1{display:none}nav a{white-space:nowrap;margin:0}main{padding:14px}}

.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fx span{position:absolute;top:-50px;opacity:.6;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(40deg)}}
main{position:relative;z-index:1}nav{z-index:1}
:root[data-holiday="halloween"]{--bg:#1c1328;--card:#2a1c3d;--tx:#f5ecff;--mu:#b7a5d1;--ln:#46325f;--ac:#ff8a2b;--on:#2a1c3d;--mix:30%;color-scheme:dark}
:root[data-holiday="halloween"] body{background:radial-gradient(circle at 85% 0,#3d2159,var(--bg) 55%) fixed}
:root[data-holiday="christmas"]{--bg:#f6fbf6;--card:#fff;--tx:#3d4a40;--mu:#7a8a7e;--ln:#dfeadf;--ac:#d9534f;--mix:55%;color-scheme:light}
:root[data-holiday="newyear"]{--bg:#fffaf0;--card:#fff;--tx:#4a4230;--mu:#8a8068;--ln:#f1e6c8;--ac:#e0a526;--on:#3a2a00;--mix:55%;color-scheme:light}
:root[data-holiday="valentine"]{--bg:#fff5f8;--card:#fff;--tx:#5a3a46;--mu:#98788a;--ln:#f8dfe7;--ac:#e8668b;--mix:55%;color-scheme:light}
:root[data-holiday="songkran"]{--bg:#f1faff;--card:#fff;--tx:#34506a;--mu:#6f8aa0;--ln:#d6ecf7;--ac:#3f9fd3;--mix:55%;color-scheme:light}
:root[data-holiday="mother"]{--bg:#f1f6ff;--card:#fff;--tx:#34456a;--mu:#7080a5;--ln:#dbe5fb;--ac:#5b8def;--mix:55%;color-scheme:light}
:root[data-holiday="father"]{--bg:#fffbea;--card:#fff;--tx:#4f4520;--mu:#8f844f;--ln:#f3ebc4;--ac:#e5b800;--on:#3a2a00;--mix:55%;color-scheme:light}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="lock" hidden></div>
<script>
const M={
todo:{n:'งานที่ต้องทำ',i:'✅',c:'#bfe8d0',f:[['title','งานที่ต้องทำ','t'],['due','กำหนดส่ง','d0']]},
notes:{n:'โน้ต',i:'📝',c:'#ffd9a8',f:[['title','หัวข้อ','t'],['body','เนื้อหา','a']]},
journal:{n:'ไดอารี่',i:'📔',c:'#dccbff',r:'body',f:[['date','วันที่','d'],['mood','อารมณ์','s',['😊','😐','😢','😡','😴']],['body','วันนี้เป็นอย่างไร','a']]},
knowledge:{n:'คลังความรู้',i:'🧠',c:'#bddcff',f:[['title','เรื่อง','t'],['tag','หมวด','t'],['body','สิ่งที่เรียนรู้','a']]},
bookmark:{n:'บุ๊กมาร์ก',i:'🔖',c:'#ffc9d6',f:[['title','ชื่อเว็บ','t'],['url','ลิงก์','u'],['tag','หมวด','t']]},
files:{n:'ไฟล์ (ลิงก์)',i:'📁',c:'#fff0a3',f:[['title','ชื่อไฟล์','t'],['url','ลิงก์ Drive/Dropbox','u'],['tag','หมวด','t']]},
calendar:{n:'ปฏิทิน',i:'📅',c:'#bfeaea',f:[['title','กิจกรรม','t'],['date','วันที่','d'],['time','เวลา','tm']]},
ideas:{n:'ไอเดีย',i:'💡',c:'#ffd0b8',f:[['title','ไอเดีย','t'],['st','สถานะ','s',['ใหม่','กำลังคิด','ลงมือแล้ว','ทิ้ง']],['body','รายละเอียด','a']]},
finance:{n:'การเงิน',i:'💰',c:'#cdeab8',f:[['title','รายการ','t'],['amt','จำนวน (฿)','n'],['type','ประเภท','s',['รายจ่าย','รายรับ']],['date','วันที่','d']]}
};
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const SB_URL='https://nsyrgwfuoyrwyhdsfkia.supabase.co',SB_KEY='sb_publishable_LJjFWwcr9Ps2k15ItZwNOQ_j8sf9hIv';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
let D={},uid=null,tm=null;
const setSt=t=>{const x=$('#st');if(x)x.textContent=t};
async function push(){const{error}=await sb.from('workspace').upsert({user_id:uid,data:D,updated_at:new Date().toISOString()});setSt(error?'⚠️ บันทึกไม่สำเร็จ: '+error.message:'☁️ บันทึกแล้ว')}
const save=()=>{if(!uid)return;setSt('กำลังบันทึก…');clearTimeout(tm);tm=setTimeout(push,600)};
async function boot(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session)return loginUI();
 uid=session.user.id;
 const{data,error}=await sb.from('workspace').select('data').eq('user_id',uid).maybeSingle();
 if(error){alert('โหลดข้อมูลไม่สำเร็จ: '+error.message);return}
 if(data)D=data.data||{};
 else{try{D=JSON.parse(localStorage.getItem('pw')||'{}')}catch{D={}}push()}
 render();
}
function loginUI(){const l=$('#lock');l.hidden=false;l.innerHTML='<div style="font-size:40px">'+(T?T.i:'🌷')+'</div><input id="em" type="email" placeholder="อีเมล" autocomplete="username"><input id="pw" type="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" autocomplete="current-password"><div><button class="add" id="li">เข้าสู่ระบบ</button> <button class="bt" id="su" style="background:var(--mu)">สมัคร</button></div><div id="msg" class="sub" style="max-width:280px;text-align:center"></div>';
 const run=async m=>{const msg=$('#msg');const c={email:$('#em').value.trim(),password:$('#pw').value};
 if(SB_URL.includes('YOUR-')||SB_KEY.includes('YOUR-')){msg.textContent='❌ ยังไม่ได้ใส่ SB_URL / SB_KEY ในไฟล์';return}
 if(!c.email||c.password.length<6){msg.textContent='❌ กรอกอีเมลและรหัสผ่าน (6 ตัวขึ้นไป) ก่อน';return}
 msg.textContent='กำลังดำเนินการ…';
 try{const r=m==='in'?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);
  if(r.error){msg.textContent='❌ '+r.error.message;return}
  if(m==='up'&&!r.data.session){msg.textContent='✅ สมัครแล้ว ถ้าระบบส่งอีเมลยืนยัน ให้กดลิงก์ในอีเมลก่อน แล้วกด เข้าสู่ระบบ';return}
  l.hidden=true;boot()}catch(x){msg.textContent='❌ เชื่อมต่อไม่ได้: '+(x&&x.message||x)}};
 $('#pw').onkeydown=x=>{if(x.key==='Enter')run('in')};
 $('#li').onclick=()=>run('in');$('#su').onclick=()=>run('up')}
const L=k=>D[k]||(D[k]=[]);
const TH={
halloween:{n:'ฮาโลวีน',i:'🎃',g:'Happy Halloween 🎃',m:'สุขสันต์วันฮาโลวีน! รีบเคลียร์งานค้างก่อนผีจะมาเยือน 👻',d:['🎃','👻','🦇','🕷️','🍬']},
christmas:{n:'คริสต์มาส',i:'🎄',g:'Merry Christmas 🎄',m:'สุขสันต์วันคริสต์มาส ขอให้อบอุ่นและมีความสุข ❄️',d:['🎄','❄️','🎁','⭐']},
newyear:{n:'ปีใหม่',i:'🎆',g:'สวัสดีปีใหม่ 🎆',m:'ปีใหม่แล้ว! ลองจดเป้าหมายใหม่ไว้ในหมวดไอเดียดูนะ ✨',d:['🎆','✨','🎉','🥂']},
valentine:{n:'วาเลนไทน์',i:'💗',g:'Happy Valentine 💗',m:'สุขสันต์วันแห่งความรัก อย่าลืมรักตัวเองด้วย 💗',d:['💗','💕','🌹','💌']},
songkran:{n:'สงกรานต์',i:'💦',g:'สุขสันต์วันสงกรานต์ 💦',m:'สงกรานต์นี้ขอให้เย็นฉ่ำ สนุก และปลอดภัย 🌼',d:['💦','🌼','🪣','🌸']},
mother:{n:'วันแม่',i:'💙',g:'สุขสันต์วันแม่ 💙',m:'วันนี้โทรหาหรือกอดแม่สักครั้งนะ 💙',d:['💙','🌸','🤍']},
father:{n:'วันพ่อ',i:'💛',g:'สุขสันต์วันพ่อ 💛',m:'วันนี้อย่าลืมบอกรักพ่อ 💛',d:['💛','🌼','⭐']}};
function holiday(d=new Date()){const m=d.getMonth()+1,x=d.getDate();
 if(m==10&&x>=25)return'halloween';if(m==12&&x>=20&&x<=26)return'christmas';if((m==12&&x>=29)||(m==1&&x<=2))return'newyear';
 if(m==2&&x>=10&&x<=14)return'valentine';if(m==4&&x>=12&&x<=16)return'songkran';if(m==8&&x>=10&&x<=12)return'mother';if(m==12&&x>=3&&x<=5)return'father';return null}
let T=null;
const pref=()=>{try{return localStorage.getItem('pw_theme')||'auto'}catch{return'auto'}};
function applyTheme(){const p=pref(),k=p==='off'?null:p==='auto'?holiday():(TH[p]?p:null);T=k?TH[k]:null;const r=document.documentElement;
 if(k)r.dataset.holiday=k;else delete r.dataset.holiday;
 document.querySelectorAll('.fx').forEach(n=>n.remove());
 if(T&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const w=document.createElement('div');w.className='fx';w.setAttribute('aria-hidden','true');
  for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=T.d[i%T.d.length];s.style.cssText=`left:${(i*7.3+3)%97}%;animation-duration:${9+(i*3)%8}s;animation-delay:-${(i*2.3)%10}s;font-size:${18+(i*5)%16}px`;w.appendChild(s)}
  document.body.appendChild(w)}}
function setTheme(v){try{localStorage.setItem('pw_theme',v)}catch{}applyTheme();render()}
let GEN={};const SU={};
async function loadImgs(){for(const im of document.querySelectorAll('img[data-img]')){const p=im.dataset.img;if(!SU[p]){const{data}=await sb.storage.from('diary').createSignedUrl(p,3600);SU[p]=data&&data.signedUrl}if(SU[p])im.src=SU[p]}}
function genPv(){return GEN.url?`<img src="${GEN.url}" alt="ภาพจากไดอารี่" style="max-width:260px;width:100%;border-radius:16px;margin-top:8px"><div><a href="${GEN.url}" download="diary-${Date.now()}.jpg" class="sub">⬇️ ดาวน์โหลดรูป</a></div>`:''}
async function gen(){const txt=($('#f_body')?.value||'').trim(),st=$('#gst'),bt=$('[data-gen]');
 if(!txt){st.textContent='เขียนข้อความในช่องก่อนนะ';return}
 const{data:{session}}=await sb.auth.getSession();if(!session){st.textContent='กรุณาล็อกอินใหม่';return}
 st.textContent='🎨 กำลังวาดภาพ… (ประมาณ 10–30 วินาที)';if(bt)bt.disabled=true;
 try{const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({text:txt})});
  if(!r.ok){const m=await r.text().catch(()=>'');throw new Error(r.status===401?'ยังไม่ได้ล็อกอิน (ลองออกจากระบบแล้วเข้าใหม่)':'สร้างภาพไม่สำเร็จ ('+r.status+') '+m.slice(0,120))}
  const b=await r.blob();if(GEN.url)URL.revokeObjectURL(GEN.url);GEN={blob:b,url:URL.createObjectURL(b)};
  $('#gpv').innerHTML=genPv();
  st.textContent='ถูกใจไหม? กด "+ เพิ่ม" เพื่อบันทึกพร้อมรูป หรือกดสร้างใหม่'}
 catch(x){st.textContent='❌ '+x.message}
 finally{if(bt)bt.disabled=false}}
let q='';
function inp([k,l,t,o]){const id='f_'+k;let x;
 if(t==='a')return `<textarea id="${id}" placeholder="${l}" rows="3"></textarea>`;
 if(t==='s')x=`<select id="${id}">${o.map(v=>`<option>${v}</option>`).join('')}</select>`;
 else{const ty={t:'text',d:'date',d0:'date',n:'number',u:'text',tm:'time'}[t];x=`<input id="${id}" type="${ty}" ${t==='d'?`value="${today()}"`:''} ${t==='n'?'step="any"':''} ${t==='t'?`placeholder="${l}"`:''}>`}
 return `<label>${l}${x}</label>`}
function item(m,k,it){const f=m.f;let head=k==='journal'?`${e(it.date)} ${e(it.mood)}`:e(it[f[0][0]]);
 const rest=(k==='journal'?[it.body]:f.slice(1).map(x=>x[2]==='u'&&it[x[0]]?`<a href="${e(it[x[0]])}" target="_blank" rel="noopener noreferrer">${e(it[x[0]])}</a>`:e(it[x[0]]))).filter(Boolean);
 if(k==='finance')head=`<span class="${it.type==='รายรับ'?'in':'out'}">${it.type==='รายรับ'?'+':'−'}${Number(it.amt).toLocaleString()} ฿</span> ${e(it.title)}`,rest.splice(0,rest.length,e(it.date));
 return `<div class="it ${it.done?'dn':''}">${k==='todo'?`<input type="checkbox" data-chk="${it.id}" ${it.done?'checked':''}>`:''}<div class="b"><b>${head}</b>${rest.length?`<small>${k==='bookmark'||k==='files'?rest.join(' · '):rest.join(' · ')}</small>`:''}${it.img?`<img data-img="${e(it.img)}" alt="" style="display:block;max-width:200px;width:100%;min-height:60px;border-radius:14px;margin-top:8px;background:var(--ln)">`:''}</div><button class="x" data-del="${k}:${it.id}" aria-label="ลบ">✕</button></div>`}
function sorted(k){const a=[...L(k)];if(k==='calendar')return a.sort((x,y)=>(x.date+x.time)>(y.date+y.time)?1:-1);if(k==='finance'||k==='journal')return a.sort((x,y)=>y.date>x.date?1:-1);return a.sort((x,y)=>y.id-x.id)}
function module(k){const m=M[k];const a=sorted(k).filter(it=>!q||JSON.stringify(it).toLowerCase().includes(q.toLowerCase()));
 let sum='';if(k==='finance'){const t=L(k);const inc=t.filter(x=>x.type==='รายรับ').reduce((s,x)=>s+ +x.amt,0),out=t.filter(x=>x.type!=='รายรับ').reduce((s,x)=>s+ +x.amt,0);sum=`<div class="grid"><div class="stat" style="--c:#cdeab8"><span>รายรับ</span><b>${inc.toLocaleString()}</b></div><div class="stat" style="--c:#ffc9d6"><span>รายจ่าย</span><b>${out.toLocaleString()}</b></div><div class="stat" style="--c:#bddcff"><span>คงเหลือ</span><b>${(inc-out).toLocaleString()}</b></div></div>`}
 return `<h2>${m.i} ${m.n}</h2><div class="sub">${L(k).length} รายการ</div>${sum}<div class="card"><div class="form">${m.f.map(inp).join('')}<button class="add" data-add="${k}">+ เพิ่ม</button></div>${k==='journal'?`<div style="margin-top:10px"><button class="bt" data-gen>✨ สร้างภาพจากข้อความ</button> <span id="gst" class="sub"></span><div id="gpv">${genPv()}</div></div>`:''}</div><div class="card"><input id="q" placeholder="🔍 ค้นหา" value="${e(q)}"><div>${a.map(it=>item(m,k,it)).join('')||'<div class="sub" style="margin:12px 0 0">ยังไม่มีรายการ</div>'}</div></div>`}
function dash(){const t=today(),mo=t.slice(0,7);
 const open=L('todo').filter(x=>!x.done).sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1).slice(0,5);
 const ev=L('calendar').filter(x=>x.date>=t).sort((a,b)=>a.date>b.date?1:-1).slice(0,4);
 const fm=L('finance').filter(x=>(x.date||'').startsWith(mo));const inc=fm.filter(x=>x.type==='รายรับ').reduce((s,x)=>s+ +x.amt,0),out=fm.filter(x=>x.type!=='รายรับ').reduce((s,x)=>s+ +x.amt,0);
 const done=L('todo').filter(x=>x.done).length,tot=L('todo').length;
 const dt=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 return `<h2>${T?T.g:'สวัสดี 🌸'}</h2><div class="sub">${dt}</div>${T?`<div class="card" style="border-color:var(--ac)">${T.m}</div>`:''}
<div class="grid">${Object.entries(M).map(([k,m])=>`<button class="stat" style="--c:${m.c}" data-go="${k}"><span>${m.i} ${m.n}</span><b>${L(k).length}</b></button>`).join('')}</div>
<div class="grid2"><div class="card"><h3>✅ งานที่ต้องทำ (เสร็จ ${done}/${tot})</h3>${open.map(x=>`<div class="it"><input type="checkbox" data-chk="${x.id}"><div class="b"><b>${e(x.title)}</b>${x.due?`<small>ภายใน ${e(x.due)}</small>`:''}</div></div>`).join('')||'<div class="sub">ไม่มีงานค้าง 🎉</div>'}</div>
<div class="card"><h3>📅 กิจกรรมที่จะถึง</h3>${ev.map(x=>`<div class="it"><div class="b"><b>${e(x.title)}</b><small>${e(x.date)} ${e(x.time)}</small></div></div>`).join('')||'<div class="sub">ยังไม่มีนัดหมาย</div>'}</div>
<div class="card"><h3>💰 เดือนนี้</h3><div class="in">รายรับ +${inc.toLocaleString()} ฿</div><div class="out">รายจ่าย −${out.toLocaleString()} ฿</div><b>คงเหลือ ${(inc-out).toLocaleString()} ฿</b></div>
<div class="card"><h3>⚡ จดโน้ตด่วน</h3><div class="form"><textarea id="qn" rows="3" placeholder="คิดอะไรอยู่…"></textarea><button class="add" data-quick>บันทึกเป็นโน้ต</button></div></div></div>`}
function settings(){return `<h2>⚙️ ตั้งค่า</h2><div class="sub">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ ควรสำรองเป็นระยะ</div><div class="card"><h3>🎨 ธีมตามวันสำคัญ</h3><select onchange="setTheme(this.value)"><option value="auto" ${pref()==='auto'?'selected':''}>อัตโนมัติ (ตามวันที่)</option><option value="off" ${pref()==='off'?'selected':''}>ปิด (ธีมพาสเทลปกติ)</option>${Object.entries(TH).map(([k,t])=>`<option value="${k}" ${pref()===k?'selected':''}>${t.i} ${t.n}</option>`).join('')}</select></div>
<div class="card"><h3>☁️ บัญชี</h3><div class="sub" id="st">เชื่อมต่อแล้ว</div><button class="bt" onclick="sb.auth.signOut().then(()=>location.reload())">ออกจากระบบ</button></div>
<div class="card"><h3>💾 สำรอง / นำเข้า</h3><textarea id="bk" rows="6">${e(JSON.stringify(D))}</textarea><div class="form" style="margin-top:8px"><button class="add" data-imp>นำเข้าข้อมูลจากข้อความด้านบน</button></div><div class="sub" style="margin:8px 0 0">คัดลอกข้อความไปเก็บไว้ในไฟล์/โน้ตของคุณเพื่อสำรอง</div></div>`}
function render(){const v=(location.hash||'#dash').slice(1);
 $('#nav').innerHTML=`<h1>${T?T.i:'🌷'} My Workspace</h1>`+[['dash','🏠','แดชบอร์ด','#d9ccff'],...Object.entries(M).map(([k,m])=>[k,m.i,m.n,m.c]),['set','⚙️','ตั้งค่า','#ddd']].map(([k,i,n,c])=>`<a href="#${k}" style="--c:${c}" class="${k===v?'on':''}">${i} ${n}</a>`).join('');
 $('#main').innerHTML=M[v]?module(v):v==='set'?settings():dash();loadImgs()}
async function add(k){const m=M[k],o={id:Date.now()};
 m.f.forEach(([key,,t])=>{let v=($('#f_'+key)?.value||'').trim();if(key==='url'&&v&&!/^https?:\/\//i.test(v))v='https://'+v;o[key]=v});
 if(!o[m.r||m.f[0][0]])return;if(k==='todo')o.done=false;if(k==='journal'&&GEN.blob){const p=uid+'/'+o.id+'.jpg';const{error}=await sb.storage.from('diary').upload(p,GEN.blob,{contentType:'image/jpeg',upsert:true});if(error)alert('บันทึกรูปไม่สำเร็จ: '+error.message);else o.img=p;GEN={}}L(k).push(o);save();render()}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-add],[data-del],[data-chk],[data-go],[data-quick],[data-pin],[data-nopin],[data-imp],[data-gen]');if(!t)return;const d=t.dataset;
 if(d.add)add(d.add);else if(d.gen)gen();
 else if(d.del){const[k,id]=d.del.split(':');const old=L(k).find(x=>x.id==id);if(old&&old.img)sb.storage.from('diary').remove([old.img]);D[k]=L(k).filter(x=>x.id!=id);save();render()}
 else if(d.go)location.hash=d.go;
 else if(d.quick){const v=$('#qn').value.trim();if(v){L('notes').push({id:Date.now(),title:v.slice(0,40),body:v});save();render()}}
 else if(d.pin){const p=$('#pin').value;if(/^\d{4,8}$/.test(p)){try{localStorage.setItem('pw_pin',btoa('pw'+p))}catch{}alert('ตั้ง PIN แล้ว')}else alert('PIN ต้องเป็นตัวเลข 4–8 หลัก')}
 else if(d.nopin){try{localStorage.removeItem('pw_pin')}catch{}alert('ลบ PIN แล้ว')}
 else if(d.imp){try{const j=JSON.parse($('#bk').value);if(typeof j==='object'&&j){D=j;save();render();alert('นำเข้าแล้ว')}}catch{alert('รูปแบบข้อมูลไม่ถูกต้อง')}}});
document.addEventListener('change',ev=>{const id=ev.target.dataset.chk;if(!id)return;const it=L('todo').find(x=>x.id==id);if(it){it.done=ev.target.checked;save();render()}});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){q=ev.target.value;const p=ev.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('.form input:not([type=date])')){const b=ev.target.closest('.card').querySelector('[data-add]');b&&b.click()}});
addEventListener('hashchange',()=>{q='';render()});
applyTheme();boot();
</script>
